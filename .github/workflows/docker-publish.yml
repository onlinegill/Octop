name: Docker Publish

# Build and publish images to Docker Hub and GHCR only on version tags (v*).
# Docs and external references consistently use: ghcr.io/onlinegill/octop
# (The Hub is still pushed in sync using the DOCKERHUB_* secrets.)
#
# Architecture: ubuntu-latest builds linux/amd64, ubuntu-24.04-arm builds linux/arm64,
# then they are merged into the :{version} / :latest multi-arch manifest. The FnOS Docker FPK shares one copy,
# and the NAS pulls the layer matching its own architecture.
