name: Docker Publish

# Build and publish images to Docker Hub and GHCR only on version tags (v*).
# Docs and external references consistently use: ghcr.io/onlinegill/octop
# (The Hub is still pushed in sync using the DOCKERHUB_* secrets.)
#
# Architecture: ubuntu-latest builds linux/amd64, ubuntu-24.04-arm builds linux/arm64,
# then they are merged into the :{version} / :latest multi-arch manifest. The FnOS Docker FPK shares one copy,
# and the NAS pulls the layer matching its own architecture.
#
# Trigger paths:
#   1. A manual v* tag push → on.push.tags
#   2. Auto Tag pushing a tag with GITHUB_TOKEN, then an explicit workflow_dispatch (a token push does not trigger the push workflow)
#
# Note: under workflow_dispatch, metadata-action's type=semver is unreliable,
# so the version must be parsed explicitly from GITHUB_REF_NAME.
#
# The FnOS FPK is dispatched automatically after a successful Release, and waits for the :{version} pushed by this workflow.
#
# Pull examples:
#   docker pull ghcr.io/onlinegill/octop:latest
#   docker pull ghcr.io/onlinegill/octop:0.9.28
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  prepare:
    name: Resolve version
    runs-on: ubuntu-latest
    # Refuse to run accidentally on a non-v* ref (for example, clicking "Run workflow" on main in the UI)
    if: startsWith(github.ref, 'refs/tags/v')
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
      ghcr: ${{ steps.image.outputs.ghcr }}
      hub: ${{ steps.image.outputs.hub }}
    steps:
      - name: Resolve version from tag ref
        id: ver
        run: |
          set -euo pipefail
          ref="${GITHUB_REF_NAME}"
          case "$ref" in
            v*)
              echo "version=${ref#v}" >> "$GITHUB_OUTPUT"
              echo "tag=$ref" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::Expected refs/tags/v*, got ref_name=$ref"
              exit 1
              ;;
          esac

      - name: Image names
        id: image
        run: |
          echo "ghcr=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          echo "hub=${{ secrets.DOCKERHUB_USERNAME }}/octop" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.arch }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            arch: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ needs.prepare.outputs.hub }}
            ${{ needs.prepare.outputs.ghcr }}
          # Per-arch intermediate tag; :{version} / :latest are merged into the multi-arch manifest
          tags: |
            type=raw,value=${{ needs.prepare.outputs.version }}-${{ matrix.arch }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          platforms: ${{ matrix.platform }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=docker-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=docker-${{ matrix.arch }}

  merge:
    name: Multi-arch manifest
    needs: [prepare, build]
    # Publish the architectures that are available even if the ARM runner fails intermittently, so :{version} and the Docker FPK are not blocked.
    if: always() && needs.prepare.result == 'success' && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifests
        env:
          VER: ${{ needs.prepare.outputs.version }}
          GHCR: ${{ needs.prepare.outputs.ghcr }}
          HUB: ${{ needs.prepare.outputs.hub }}
        run: |
          set -euo pipefail
          any_multi=0
          for REG in "$GHCR" "$HUB"; do
            sources=()
            for arch in amd64 arm64; do
              if docker buildx imagetools inspect "${REG}:${VER}-${arch}" >/dev/null 2>&1; then
                sources+=("${REG}:${VER}-${arch}")
              else
                echo "::warning::missing ${REG}:${VER}-${arch}"
              fi
            done
            if [ "${#sources[@]}" -eq 0 ]; then
              echo "::error::No platform images published for ${REG}:${VER}"
              exit 1
            fi
            if [ "${#sources[@]}" -ge 2 ]; then
              any_multi=1
            fi
            docker buildx imagetools create \
              -t "${REG}:${VER}" \
              -t "${REG}:latest" \
              "${sources[@]}"
            echo "=== ${REG}:${VER} ==="
            docker buildx imagetools inspect "${REG}:${VER}"
          done
          if [ "$any_multi" -eq 0 ]; then
            echo "::warning:::${VER} is not multi-arch (ARM image missing). Docker FPK on ARM NAS will not run."
          fi
ot run."
          fi
 run."
          fi
run."
          fi
