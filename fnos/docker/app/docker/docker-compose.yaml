services:
  octop:
    image: ghcr.io/onlinegill/octop:1.0.2b5
    container_name: octop
    restart: unless-stopped
    pull_policy: missing
    ports:
      - "8088:8088"
    # The official image entrypoint cannot read the FnOS wizard password
    # (.env is not under @appcenter).
    # Instead use a bootstrap script on the data-share: on every start it
    # initialises or resets the password using the wizard password.
    entrypoint: ["bash", "/usr/local/bin/fnos-boot.sh"]
    volumes:
      - "${TRIM_DATA_SHARE_PATHS}/.octop:/data/.octop"
      - "${TRIM_DATA_SHARE_PATHS}/fnos-boot.sh:/usr/local/bin/fnos-boot.sh:ro"
      - "${TRIM_DATA_SHARE_PATHS}/fnos-admin.env:/data/fnos-admin.env:ro"
    environment:
      - HOME=/data
      - OCTOP_HOME=/data/.octop
      - OCTOP_BIND_HOST=0.0.0.0
      - OCTOP_PORT=${OCTOP_PORT:-8088}
      - OCTOP_LOG_LEVEL=${OCTOP_LOG_LEVEL:-info}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python3 -c \"import json,urllib.request; r=json.load(urllib.request.urlopen('http://127.0.0.1:8088/api/health', timeout=3)); raise SystemExit(0 if r.get('users_loaded', 0) >= 1 else 1)\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 120s
